<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerShell – Kopier skript</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#101827;color:#eaf0fb}
*{box-sizing:border-box}body{margin:0;padding:24px 12px}.container{max-width:1050px;margin:auto}h1{font-size:clamp(1.3rem,3vw,2rem);margin:0 0 8px}p{color:#b9c4d8;margin:0 0 20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}button{border:0;border-radius:9px;background:#3b82f6;color:#fff;font-size:16px;font-weight:650;padding:12px 18px;cursor:pointer}button.secondary{background:#29384f}button:hover{filter:brightness(1.12)}textarea{display:block;width:100%;height:min(72vh,850px);min-height:360px;resize:vertical;border-radius:12px;border:1px solid #41506a;background:#0b1220;color:#e4f1ff;padding:18px;font:14px/1.55 Consolas,'Courier New',monospace;tab-size:4;white-space:pre;overflow:auto}#status{color:#8dd7ac;min-height:24px;margin-top:10px}small{color:#b9c4d8}
</style></head><body><main class="container">
<h1>PowerShell – XLS til API</h1><p>Hele skriptet ligger i tekstfeltet. Kopier det direkte til serveren. Du kan også laste ned en <code>.ps1</code>-fil.</p>
<div class="actions"><button id="copy">📋 Kopier hele skriptet</button><button class="secondary" id="select">Marker alt</button><button class="secondary" id="download">Last ned .ps1</button></div>
<textarea id="script" spellcheck="false" wrap="off" aria-label="PowerShell-skript">param(
    [string]$ConfigFile = "$PSScriptRoot\config.json",

    [switch]$ReplaceXls,
    [switch]$ReplaceTxt
)

$ErrorActionPreference = "Stop"


# =====================================================================
# CONFIG
# =====================================================================

if (-not (Test-Path $ConfigFile)) {
    throw "Finner ikke config-fil: $ConfigFile"
}

$config = Get-Content `
    -Path $ConfigFile `
    -Raw |
    ConvertFrom-Json


$basePath = $PSScriptRoot

$csvPath = Join-Path $basePath $config.Files.CsvPath


# =====================================================================
# SQL CONFIG
# =====================================================================

$sqlServer   = $config.Database.Server
$sqlDatabase = $config.Database.Database
$sqlTable    = $config.Database.Table

$integratedSecurity = [bool]$config.Database.IntegratedSecurity
$sqlUsername        = [string]$config.Database.Username
$sqlPassword        = [string]$config.Database.Password


# =====================================================================
# KONTROLLER CSV
# =====================================================================

Write-Host ""
Write-Host "============================================================"
Write-Host "TEST SQL IMPORT"
Write-Host "============================================================"
Write-Host "CSV:      $csvPath"
Write-Host "Server:   $sqlServer"
Write-Host "Database: $sqlDatabase"
Write-Host "Table:    $sqlTable"
Write-Host "============================================================"


if (-not (Test-Path $csvPath)) {
    throw "Finner ikke CSV-fil: $csvPath"
}


# =====================================================================
# LES CSV
# =====================================================================

$jobs = @(Import-Csv -Path $csvPath)


Write-Host ""
Write-Host "Antall rader i CSV: $($jobs.Count)"


if ($jobs.Count -eq 0) {
    throw "CSV-filen inneholder ingen rader."
}


# =====================================================================
# BESTEM HVA SOM SKAL ERSTATTES
# =====================================================================

if (-not $ReplaceXls -and -not $ReplaceTxt) {

    Write-Host ""
    Write-Host "Ingen source valgt eksplisitt."
    Write-Host "Finner source fra CSV..."

    $sources = @(
        $jobs |
        Select-Object -ExpandProperty Source -Unique
    )

    if ($sources -contains "XLS") {
        $ReplaceXls = $true
    }

    if ($sources -contains "TXT") {
        $ReplaceTxt = $true
    }
}


Write-Host ""
Write-Host "Replace XLS: $ReplaceXls"
Write-Host "Replace TXT: $ReplaceTxt"


if (-not $ReplaceXls -and -not $ReplaceTxt) {
    throw "Fant verken XLS eller TXT som Source i CSV."
}


# =====================================================================
# CONNECTION STRING
# =====================================================================

if ($integratedSecurity) {

    $connectionString =
        "Server=$sqlServer;" +
        "Database=$sqlDatabase;" +
        "Integrated Security=True;" +
        "TrustServerCertificate=True;"

}
else {

    $connectionString =
        "Server=$sqlServer;" +
        "Database=$sqlDatabase;" +
        "User ID=$sqlUsername;" +
        "Password=$sqlPassword;" +
        "TrustServerCertificate=True;"
}


# =====================================================================
# BYGG DATATABLE
# =====================================================================

$dataTable = New-Object System.Data.DataTable


[void]$dataTable.Columns.Add(
    "Id",
    [Int64]
)

[void]$dataTable.Columns.Add(
    "Name",
    [string]
)

[void]$dataTable.Columns.Add(
    "Pfield1Id",
    [string]
)

[void]$dataTable.Columns.Add(
    "Pfield1Name",
    [string]
)

[void]$dataTable.Columns.Add(
    "Disabled",
    [bool]
)

[void]$dataTable.Columns.Add(
    "Source",
    [string]
)


foreach ($job in $jobs) {

    $row = $dataTable.NewRow()

    try {
        $row["Id"] = [Int64]$job.Id
    }
    catch {
        throw "Kunne ikke konvertere Id '$($job.Id)' til Int64."
    }

    $row["Name"]        = [string]$job.Name
    $row["Pfield1Id"]   = [string]$job.Pfield1Id
    $row["Pfield1Name"] = [string]$job.Pfield1Name

    if (
        [string]$job.Disabled -eq "True" -or
        [string]$job.Disabled -eq "true" -or
        [string]$job.Disabled -eq "1"
    ) {
        $row["Disabled"] = $true
    }
    else {
        $row["Disabled"] = $false
    }

    $row["Source"] = [string]$job.Source

    [void]$dataTable.Rows.Add($row)
}


Write-Host ""
Write-Host "DataTable bygget."
Write-Host "Antall rader: $($dataTable.Rows.Count)"


# =====================================================================
# SQL
# =====================================================================

$connection  = New-Object System.Data.SqlClient.SqlConnection
$transaction = $null
$bulkCopy    = $null


try {

    $connection.ConnectionString = $connectionString


    Write-Host ""
    Write-Host "Åpner SQL connection..."

    $connection.Open()

    Write-Host "SQL connection OK."


    # =================================================================
    # START TRANSACTION
    # =================================================================

    $transaction = $connection.BeginTransaction()


    Write-Host ""
    Write-Host "Transaction startet."


    # =================================================================
    # DELETE XLS
    # =================================================================

    if ($ReplaceXls) {

        Write-Host ""
        Write-Host "Sletter eksisterende XLS-rader..."

        $deleteXls = $connection.CreateCommand()

        $deleteXls.Transaction = $transaction

        $deleteXls.CommandText = @"
DELETE FROM $sqlTable
WHERE Source = 'XLS'
"@

        $deletedXls = $deleteXls.ExecuteNonQuery()

        Write-Host "Slettet XLS-rader: $deletedXls"
    }


    # =================================================================
    # DELETE TXT
    # =================================================================

    if ($ReplaceTxt) {

        Write-Host ""
        Write-Host "Sletter eksisterende TXT-rader..."

        $deleteTxt = $connection.CreateCommand()

        $deleteTxt.Transaction = $transaction

        $deleteTxt.CommandText = @"
DELETE FROM $sqlTable
WHERE Source = 'TXT'
"@

        $deletedTxt = $deleteTxt.ExecuteNonQuery()

        Write-Host "Slettet TXT-rader: $deletedTxt"
    }


    # =================================================================
    # FILTRER DATATABLE
    # =================================================================

    $importTable = $dataTable.Clone()


    foreach ($row in $dataTable.Rows) {

        $source = [string]$row["Source"]

        if (
            ($source -eq "XLS" -and $ReplaceXls) -or
            ($source -eq "TXT" -and $ReplaceTxt)
        ) {

            $importTable.ImportRow($row)
        }
    }


    Write-Host ""
    Write-Host "Rader som skal importeres: $($importTable.Rows.Count)"


    # =================================================================
    # BULK COPY
    # =================================================================

    if ($importTable.Rows.Count -gt 0) {

        Write-Host ""
        Write-Host "Starter SqlBulkCopy..."


        $bulkCopy = New-Object `
            System.Data.SqlClient.SqlBulkCopy(
                $connection,
                [System.Data.SqlClient.SqlBulkCopyOptions]::Default,
                $transaction
            )


        $bulkCopy.DestinationTableName = $sqlTable

        $bulkCopy.BatchSize = 1000

        $bulkCopy.BulkCopyTimeout = 300


        [void]$bulkCopy.ColumnMappings.Add(
            "Id",
            "Id"
        )

        [void]$bulkCopy.ColumnMappings.Add(
            "Name",
            "Name"
        )

        [void]$bulkCopy.ColumnMappings.Add(
            "Pfield1Id",
            "Pfield1Id"
        )

        [void]$bulkCopy.ColumnMappings.Add(
            "Pfield1Name",
            "Pfield1Name"
        )

        [void]$bulkCopy.ColumnMappings.Add(
            "Disabled",
            "Disabled"
        )

        [void]$bulkCopy.ColumnMappings.Add(
            "Source",
            "Source"
        )


        $bulkCopy.WriteToServer($importTable)


        Write-Host "SqlBulkCopy OK."

    }
    else {

        Write-Host ""
        Write-Host "Ingen rader å bulk-inserte."
        Write-Host "Delete vil fortsatt beholdes dersom transaction commits."
    }


    # =================================================================
    # COMMIT
    # =================================================================

    $transaction.Commit()


    Write-Host ""
    Write-Host "============================================================"
    Write-Host "SQL IMPORT OK"
    Write-Host "============================================================"
    Write-Host "Rader importert: $($importTable.Rows.Count)"
    Write-Host "============================================================"

}
catch {

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "SQL IMPORT FEILET"
    Write-Host "============================================================"

    Write-Host $_.Exception.Message

    Write-Host ""
    Write-Host "Base exception:"
    Write-Host $_.Exception.GetBaseException().Message


    if ($transaction) {

        try {

            Write-Host ""
            Write-Host "Ruller tilbake transaction..."

            $transaction.Rollback()

            Write-Host "Rollback OK."

        }
        catch {

            Write-Host "Rollback feilet:"
            Write-Host $_.Exception.Message
        }
    }


    Write-Host "============================================================"

    throw
}
finally {

    if ($bulkCopy) {

        try {
            $bulkCopy.Close()
            $bulkCopy.Dispose()
        }
        catch {}
    }


    if ($transaction) {

        try {
            $transaction.Dispose()
        }
        catch {}
    }


    if ($connection) {

        try {

            if (
                $connection.State -ne
                [System.Data.ConnectionState]::Closed
            ) {

                $connection.Close()
            }

            $connection.Dispose()

        }
        catch {}
    }
}
</textarea><div id="status" role="status" aria-live="polite"></div><small>Kopieringen bruker nettleserens utklippstavle. Hvis knappen ikke virker, bruk «Marker alt» og Ctrl+C.</small>
</main><script>
const field=document.getElementById('script');const status=document.getElementById('status');
document.getElementById('select').addEventListener('click',()=>{field.focus();field.select();status.textContent='Alt er markert – trykk Ctrl+C for å kopiere.'});
document.getElementById('copy').addEventListener('click',async()=>{field.focus();field.select();let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);ok=true}else{ok=document.execCommand('copy')}}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}status.textContent=ok?'✓ Hele skriptet er kopiert!':'Teksten er markert. Trykk Ctrl+C for å kopiere.'});
document.getElementById('download').addEventListener('click',()=>{const blob=new Blob(['\ufeff',field.value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='xls_til_api.ps1';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='PS1-filen er klargjort for nedlasting.'});
</script></body></html>
