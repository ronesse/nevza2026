<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerShell – Kopier skript</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#101827;color:#eaf0fb}
*{box-sizing:border-box}body{margin:0;padding:24px 12px}.container{max-width:1050px;margin:auto}h1{font-size:clamp(1.3rem,3vw,2rem);margin:0 0 8px}p{color:#b9c4d8;margin:0 0 20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}button{border:0;border-radius:9px;background:#3b82f6;color:#fff;font-size:16px;font-weight:650;padding:12px 18px;cursor:pointer}button.secondary{background:#29384f}button:hover{filter:brightness(1.12)}textarea{display:block;width:100%;height:min(72vh,850px);min-height:360px;resize:vertical;border-radius:12px;border:1px solid #41506a;background:#0b1220;color:#e4f1ff;padding:18px;font:14px/1.55 Consolas,'Courier New',monospace;tab-size:4;white-space:pre;overflow:auto}#status{color:#8dd7ac;min-height:24px;margin-top:10px}small{color:#b9c4d8}
</style></head><body><main class="container">
<h1>PowerShell – XLS til API</h1><p>Hele skriptet ligger i tekstfeltet. Kopier det direkte til serveren. Du kan også laste ned en <code>.ps1</code>-fil.</p>
<div class="actions"><button id="copy">📋 Kopier hele skriptet</button><button class="secondary" id="select">Marker alt</button><button class="secondary" id="download">Last ned .ps1</button></div>
<textarea id="script" spellcheck="false" wrap="off" aria-label="PowerShell-skript">
$connectionString = `
    "Server=$server;" +
    "Database=$database;" +
    "User ID=$username;" +
    "Password=$password;" +
    "TrustServerCertificate=True;" +
    "Connection Timeout=10;"

$connection = New-Object System.Data.SqlClient.SqlConnection
$connection.ConnectionString = $connectionString

try {

    Write-Host "Tester SQL..."
    Write-Host "Server:   $server"
    Write-Host "Database: $database"
    Write-Host "Username: $username"

    $connection.Open()

    Write-Host ""
    Write-Host "SQL CONNECTION OK"
    Write-Host "ServerVersion: $($connection.ServerVersion)"
}
catch {

    Write-Host ""
    Write-Host "SQL CONNECTION FEILET"
    Write-Host $_.Exception.Message

    Write-Host ""
    Write-Host "Base exception:"
    Write-Host $_.Exception.GetBaseException().Message
}
finally {

    if ($connection.State -ne "Closed") {
        $connection.Close()
    }

    $connection.Dispose()
}
    
</textarea><div id="status" role="status" aria-live="polite"></div><small>Kopieringen bruker nettleserens utklippstavle. Hvis knappen ikke virker, bruk «Marker alt» og Ctrl+C.</small>
</main><script>
const field=document.getElementById('script');const status=document.getElementById('status');
document.getElementById('select').addEventListener('click',()=>{field.focus();field.select();status.textContent='Alt er markert – trykk Ctrl+C for å kopiere.'});
document.getElementById('copy').addEventListener('click',async()=>{field.focus();field.select();let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);ok=true}else{ok=document.execCommand('copy')}}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}status.textContent=ok?'✓ Hele skriptet er kopiert!':'Teksten er markert. Trykk Ctrl+C for å kopiere.'});
document.getElementById('download').addEventListener('click',()=>{const blob=new Blob(['\ufeff',field.value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='xls_til_api.ps1';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='PS1-filen er klargjort for nedlasting.'});
</script></body></html>
